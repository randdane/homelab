name: vaultwarden

x-homelab:
  lifecycle: planned
  host: server
  exposure: lan
  data: precious
  purpose: Password manager -- the one stack whose data loss is unrecoverable
  prerequisites: HTTPS via Caddy before any browser extension or mobile client will connect
  description: Bitwarden-compatible server, SQLite-backed

services:
  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
      # Turn on only long enough to create your account, then set it back to
      # false and recreate -- otherwise anyone who reaches this can register.
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-false}
      # Enables /admin. Generate with `openssl rand -base64 48`. Leave unset
      # and the admin page stays disabled, which is the safe default.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # Vaultwarden must know its own external URL or attachments, WebAuthn,
      # and the browser extensions misbehave. Set once Caddy is in front.
      # Must include the scheme -- Vaultwarden refuses to start on a bare
      # hostname, and treats an empty string as invalid rather than unset,
      # so this default is load-bearing, not decorative.
      - DOMAIN=${DOMAIN:-http://localhost:${PORT:-8081}}
    ports:
      - "${PORT:-8081}:80"
    volumes:
      - data:/data
    labels:
      homepage.group: Security
      homepage.name: Vaultwarden
      homepage.description: Passwords and TOTP codes
      homepage.href: http://${HOMELAB_HOST:-localhost}:${PORT:-8081}
      homepage.icon: vaultwarden
      # SQLite mid-write is a corrupt archive. This one matters most.
      docker-volume-backup.stop-during-backup: "true"
    # No healthcheck block: the image already ships `CMD /healthcheck.sh`.

volumes:
  data:
