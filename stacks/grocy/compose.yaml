name: grocy

x-homelab:
  lifecycle: production
  host: always-on
  exposure: lan
  data: precious
  purpose: Tracks what food is in the house, what it cost, and when it expires
  prerequisites: PUBLIC_DOMAIN in .env
  description: ERP for the fridge; complements Mealie rather than overlapping it

services:
  grocy:
    image: linuxserver/grocy:4.6.0
    container_name: grocy
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Login is Authentik forward-auth in Caddy; Grocy trusts the username
      # header it sets and creates the user on first sight. API-key requests
      # (the Android app) are checked before the header. Anything that can
      # reach port 80 with this header IS that user -- hence loopback only,
      # and Caddy strips it on the /api path. See README.
      - GROCY_AUTH_CLASS=Grocy\Middleware\ReverseProxyAuthMiddleware
      - GROCY_REVERSE_PROXY_AUTH_HEADER=X-Authentik-Username
    # Loopback only: the vhost is the way in, this is break-glass over ssh.
    ports:
      - "127.0.0.1:${PORT:-8092}:80"
    # Joins `edge` so Caddy can reach it for the grocy.<PUBLIC_DOMAIN> vhost.
    networks:
      - default
      - edge
    volumes:
      - config:/config
    labels:
      homepage.group: Home
      homepage.name: Grocy
      homepage.description: Stock, chores, and what expires this week
      homepage.href: https://grocy.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      homepage.icon: grocy
      docker-volume-backup.stop-during-backup: "true"

volumes:
  # SQLite: stock, purchase history, chores, and barcodes. Entered by hand
  # over months, which is exactly what makes it painful to lose.
  config:

networks:
  edge:
    external: true
