name: paperless

x-homelab:
  lifecycle: production
  host: always-on
  exposure: lan
  data: precious
  purpose: Scanned documents, OCR'd and searchable -- the paper filing cabinet
  prerequisites: PAPERLESS_DB_PASSWORD, PAPERLESS_SECRET_KEY and PUBLIC_DOMAIN in .env
  description: paperless-ngx with Postgres and Redis; PDFs and images only, no Office or email ingestion

services:
  broker:
    image: redis:7-alpine
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:17-alpine
    container_name: paperless-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=${PAPERLESS_DB_PASSWORD:?set PAPERLESS_DB_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    labels:
      docker-volume-backup.stop-during-backup: "true"
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "paperless", "-U", "paperless"]
      interval: 10s
      timeout: 45s
      retries: 10

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5
    container_name: paperless-webserver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      - PAPERLESS_TIME_ZONE=${TZ:-America/Chicago}
      - PAPERLESS_REDIS=redis://broker:6379
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD:?set PAPERLESS_DB_PASSWORD in .env}
      # Django signs sessions with this. Changing it logs everyone out;
      # leaving it at a default would let anyone forge a session cookie.
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY:?set PAPERLESS_SECRET_KEY in .env}
      # The vhost. Django derives ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS from
      # it, so a wrong value shows up as "CSRF verification failed" on login.
      # Laptop testing only: PAPERLESS_URL=http://localhost:8000
      - PAPERLESS_URL=${PAPERLESS_URL:-https://paperless.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}}
      # SSO through Authentik (README). PAPERLESS_APPS blank in .env leaves
      # allauth's OIDC app uninstalled, so the provider JSON is ignored and the
      # laptop runs without a client. Password login stays as break-glass.
      - PAPERLESS_APPS=${PAPERLESS_APPS:-}
      - 'PAPERLESS_SOCIALACCOUNT_PROVIDERS={"openid_connect":{"APPS":[{"provider_id":"authentik","name":"Authentik","client_id":"${OIDC_CLIENT_ID:-}","secret":"${OIDC_CLIENT_SECRET:-}","settings":{"server_url":"https://authentik.${PUBLIC_DOMAIN}/application/o/paperless/.well-known/openid-configuration"}}]}}'
      # Upstream defaults this to yes: anyone Authentik admits would get an
      # account. Off, so SSO only logs in to an account you connected
      # yourself (Profile -> Connect, README).
      - PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS=false
      - PAPERLESS_OCR_LANGUAGE=${PAPERLESS_OCR_LANGUAGE:-eng}
      - USERMAP_UID=${PUID:-1000}
      - USERMAP_GID=${PGID:-1000}
    # Loopback only: the vhost is the way in, this is break-glass over ssh.
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - export:/usr/src/paperless/export
      - consume:/usr/src/paperless/consume
    # Joins `edge` so Caddy can reach it by container name for the
    # paperless.<PUBLIC_DOMAIN> vhost.
    networks:
      - default
      - edge
    labels:
      homepage.group: Files
      homepage.name: Paperless
      homepage.description: Searchable archive of every scanned document
      homepage.href: https://paperless.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      homepage.icon: paperless
      docker-volume-backup.stop-during-backup: "true"
    # No healthcheck block: the image already ships one.

  # Scan-to-SMB for the Raven scanner: one share, `scans`, which is the
  # consume folder. Only the scanner's address gets in (here and in
  # 101.fw); README, "The scanner".
  samba:
    image: crazymax/samba:4.23.8
    container_name: paperless-samba
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
      - CONFIG_FILE=/etc/homelab/samba.yml
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SAMBA_HOSTS_ALLOW=${SCANNER_IP:?set SCANNER_IP in .env}
      - SAMBA_FOLLOW_SYMLINKS=no
      - SAMBA_WIDE_LINKS=no
    # The host's LAN address, not 0.0.0.0, so the tailnet address is not a
    # way in. 127.0.0.1 by default: the laptop never serves it.
    ports:
      - "${SAMBA_BIND_IP:-127.0.0.1}:445:445"
    volumes:
      - consume:/consume
      - samba-data:/data
      - ./samba.yml:/etc/homelab/samba.yml:ro
      # The raven user's password; outside the repo, like karakeep's.
      - ${HOME}/.local/share/_r_/paperless-samba:/run/secrets:ro
    healthcheck:
      # Process check, not a connection: hosts allow refuses loopback and
      # logged "Denied connection" every 30 s.
      test: ["CMD", "pgrep", "-x", "smbd"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    external: true

volumes:
  # The document originals and the search index. Losing these means
  # re-scanning paper that may no longer exist.
  data:
  media:
  pg-data:
  redis-data:
    labels:
      # Just the task queue. Rebuilt on start.
      homelab.backup: exclude
  export:
    labels:
      # Manual export target -- written only when you ask for a dump.
      homelab.backup: exclude
  consume:
    labels:
      # Inbox. Files here are deleted as soon as they are ingested.
      homelab.backup: exclude
  samba-data:
    labels:
      # Samba's passdb and caches, rebuilt from samba.yml on every start.
      homelab.backup: exclude
