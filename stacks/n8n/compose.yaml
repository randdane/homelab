name: n8n

x-homelab:
  lifecycle: planned
  host: server
  exposure: lan
  data: precious
  purpose: Glue between services -- scheduled jobs and webhook automations built visually
  prerequisites: N8N_ENCRYPTION_KEY in .env, set before first run
  description: Workflows and stored credentials live in one volume, encrypted with a key you must keep

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.34.4
    container_name: n8n
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
      - GENERIC_TIMEZONE=${TZ:-America/Chicago}
      # Encrypts stored credentials. n8n generates one on first run and hides
      # it inside the volume; setting it explicitly means a restore into a
      # fresh volume can still decrypt them. Changing it later orphans every
      # saved credential.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=${N8N_HOST:-localhost}
      # Webhooks are handed out to third parties, so n8n must know the URL
      # they will call back on -- not the one it sees internally.
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_DIAGNOSTICS_ENABLED=false
    ports:
      - "${PORT:-5678}:5678"
    volumes:
      - data:/home/node/.n8n
    labels:
      homepage.group: Automation
      homepage.name: n8n
      homepage.description: Scheduled jobs and webhook automations
      homepage.href: http://${HOMELAB_HOST:-localhost}:${PORT:-5678}
      homepage.icon: n8n
      docker-volume-backup.stop-during-backup: "true"

volumes:
  # Workflows, execution history, and encrypted credentials.
  data:
