# VictoriaMetrics reads this with -promscrape.config. Reload without a restart:
#   curl -X POST http://127.0.0.1:8428/-/reload   (from homelab)
scrape_configs:
  - job_name: victoriametrics
    static_configs:
      - targets: ["monitoring-victoriametrics:8428"]

  # Multi-target Blackbox: each target is passed to the exporter as ?target=,
  # `instance` is the target itself, and the scrape goes to the exporter.
  # Alerts key on probe_success, never on `up` (which only says Blackbox answered).
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://ntfy:80/v1/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: monitoring-blackbox:9115

  # pve's exporters (plan step 5): HTTPS with basic auth, on pve's LAN address
  # only; pve's host firewall admits 9100/9633 from homelab alone. The cert is
  # pve's self-signed one, copied to config/pve-exporter.crt on homelab and
  # gitignored (README). %{VAR} comes from VictoriaMetrics' environment.
  - job_name: pve-node
    scheme: https
    tls_config:
      ca_file: /etc/monitoring/pve-exporter.crt
    basic_auth:
      username: monitor
      password: "%{PVE_EXPORTER_PASSWORD}"
    static_configs:
      - targets: ["%{PVE_HOST}:9100"]
        labels: {host: pve}

  - job_name: pve-smartctl
    scheme: https
    tls_config:
      ca_file: /etc/monitoring/pve-exporter.crt
    basic_auth:
      username: monitor
      password: "%{PVE_EXPORTER_PASSWORD}"
    static_configs:
      - targets: ["%{PVE_HOST}:9633"]
        labels: {host: pve}
