# Alert rules for pve's host and disks (plan step 5 follow-up). Contact point
# and policy are in alerting.yml. SMART is also watched by smartd on pve
# (docs/smart.md); this is the second, history-backed path, not a replacement.
# Thresholds from the first readings 2026-11-05: HDDs 43-44 C, NVMe 31 C.
apiVersion: 1

groups:
  - orgId: 1
    name: pve-disks
    folder: Homelab
    interval: 1m
    rules:
      - uid: pve-exporter-down
        title: pve exporter not scraped
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} on pve is not answering VictoriaMetrics, so its disk and host alerts cannot fire"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'up{job=~"pve-node|pve-smartctl"}', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B == 0", datasource: {type: __expr__, uid: __expr__}}
      - uid: smart-failed
        title: SMART health failed
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Alerting
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.device }} on pve reports SMART overall health FAILED"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'smartctl_device_smart_status', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B == 0", datasource: {type: __expr__, uid: __expr__}}
      - uid: smart-devices-missing
        title: SMART disk missing
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: critical}
        annotations:
          summary: "fewer than 3 disks report SMART on pve: one has dropped out, or the exporter cannot read it"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'count(smartctl_device_smart_status)', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B < 3", datasource: {type: __expr__, uid: __expr__}}
      - uid: zfs-pool-not-online
        title: ZFS pool not online
        condition: C
        for: 0s
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: critical}
        annotations:
          summary: "zpool {{ $labels.zpool }} on pve is not ONLINE (degraded, faulted or resilvering)"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'node_zfs_zpool_state{state="online"}', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B == 0", datasource: {type: __expr__, uid: __expr__}}
      - uid: hdd-hot
        title: HDD hot
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.device }} on pve is above 55 C (normal 43-44 C)"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'smartctl_device_temperature{temperature_type="current",device=~"sd.*"}', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B > 55", datasource: {type: __expr__, uid: __expr__}}
      - uid: nvme-hot
        title: NVMe hot
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.device }} on pve is above 70 C (normal about 31 C)"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'smartctl_device_temperature{temperature_type="current",device=~"nvme.*"}', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B > 70", datasource: {type: __expr__, uid: __expr__}}
      - uid: nvme-critical-warning
        title: NVMe critical warning
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Alerting
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.device }} on pve has set its NVMe critical warning flag"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'smartctl_device_critical_warning', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B > 0", datasource: {type: __expr__, uid: __expr__}}
      - uid: nvme-media-errors
        title: NVMe media errors
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Alerting
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.device }} on pve reports NVMe media errors"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'smartctl_device_media_errors', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B > 0", datasource: {type: __expr__, uid: __expr__}}
      # LVM thin pool (local-lvm): every guest disk lives in it, so a full pool
      # stalls all of them. Written by pve-lvm-thin.timer (scripts/lvm_thin_metrics.py).
      # 80%: at 8.5% on 2026-11-09, so this is far from normal and still leaves
      # room to act. No data alerts: it means the timer stopped.
      - uid: lvm-thin-full
        title: LVM thin pool filling
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: critical}
        annotations:
          summary: "thin pool {{ $labels.vg }}/{{ $labels.lv }} is over 80% full (data or metadata); every volume in it stalls when it fills (incus/IncusThinPool is kennel's, read via the guest agent)"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'max by (vg, lv) ({__name__=~"lvm_thin_(data|metadata)_percent"})', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B > 80", datasource: {type: __expr__, uid: __expr__}}
      - uid: lvm-thin-stale
        title: LVM thin pool metrics stale
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: warning}
        annotations:
          summary: "thin-pool usage not updated for 20 min{{ if $labels.vmid }} for VM {{ $labels.vmid }} (guest agent read failing){{ end }}, so the pool-full alert cannot fire"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'time() - lvm_thin_last_run_timestamp_seconds', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B > 1200", datasource: {type: __expr__, uid: __expr__}}
      # kennel's two firewall layers, checked hourly on pve (scripts/kennel_fw_check.py).
      - uid: kennel-fw-drift
        title: kennel firewall drifted
        condition: C
        for: 0s
        noDataState: OK   # no data is kennel-fw-stale's to report
        execErrState: Alerting
        labels: {severity: critical}
        annotations:
          summary: "kennel's firewall (pve 200.fw or the router rules) no longer matches what is recorded, or could not be read; the agents may reach the LAN. Reasons: journalctl -u pve-kennel-fw on pve"
        data:
          - refId: A
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'kennel_fw_ok', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B == 0", datasource: {type: __expr__, uid: __expr__}}
      - uid: kennel-fw-stale
        title: kennel firewall check stale
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: warning}
        annotations:
          summary: "pve-kennel-fw.timer has not finished a run in 3 h, so kennel firewall drift would go unnoticed"
        data:
          - refId: A
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'time() - kennel_fw_last_run_timestamp_seconds', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B > 10800", datasource: {type: __expr__, uid: __expr__}}
