apiVersion: 1

groups:
  - orgId: 1
    name: probes
    folder: Homelab
    interval: 1m
    rules:
      - uid: probe-failed
        title: Probe failed
        condition: C
        for: 2m
        noDataState: Alerting    # one target: a vanished probe_success series must not read as healthy
        execErrState: Alerting
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} is not answering its probe"
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: "probe_success", instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B == 0", datasource: {type: __expr__, uid: __expr__}}
      - uid: blackbox-down
        title: Blackbox not scraped
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: critical}
        annotations:
          summary: "Blackbox exporter is not answering VictoriaMetrics, so no probe can be trusted"
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: victoriametrics
            model: {refId: A, expr: 'up{job="blackbox"}', instant: true, range: false}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$B == 0", datasource: {type: __expr__, uid: __expr__}}

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy-webhook
        type: webhook
        settings:
          url: http://ntfy:80/homelab-alerts
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $NTFY_TOKEN

policies:
  - orgId: 1
    receiver: ntfy
    group_by: [alertname, grafana_folder]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
