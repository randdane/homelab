name: monitoring

# Metrics history, dashboards and alerts. VictoriaMetrics stores and scrapes,
# Blackbox probes, Grafana draws and alerts (unified alerting, no Alertmanager).
# Beszel and Uptime Kuma stay; this runs beside them. Plan:
# homelab-private/docs/superpowers/plans/2026-11-05-monitoring.md

x-homelab:
  lifecycle: developing
  host: always-on
  exposure: lan
  # Everything here is rebuilt from config/ in the repo; history is the only
  # loss and 30 days of it is not precious.
  data: replaceable
  purpose: Metrics history and alerts on probes of the homelab, beside Beszel and Uptime Kuma
  prerequisites: .env filled in (README); the ntfy `homelab` token
  description: VictoriaMetrics, Grafana and Blackbox Exporter, all configured from files

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    container_name: monitoring-victoriametrics
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -promscrape.config=/etc/monitoring/scrape.yml
      - -httpListenAddr=:8428
    # No %{VAR} secrets yet; phase 2's pve job reads its password from the
    # environment (README), so the variable goes here when that job does.
    environment:
      - TZ=${TZ:-America/Chicago}
    ports:
      # vmui and /targets over `ssh -L`; no vhost, no login screen of its own.
      - "127.0.0.1:${VM_PORT:-8428}:8428"
    volumes:
      # The directory, not the file: a single-file bind mount stays pinned to
      # the old inode after git pull or an editor save, and /-/reload rereads
      # the stale copy (seen 2026-11-05; conventions.md, single-file mounts).
      - ./config:/etc/monitoring:ro
      - vm-data:/storage
    healthcheck:
      # The image ships wget and not curl; checked 2026-11-05. 127.0.0.1, not
      # localhost: on homelab localhost resolved to ::1, which VM did not answer.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8428/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:13.2.5
    container_name: monitoring-grafana
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Read by Grafana's own $VAR expansion in provisioning/alerting/.
      - NTFY_TOKEN=${NTFY_TOKEN:?set NTFY_TOKEN in .env}
      # The vhost; OAuth callbacks and links are built from it.
      - GF_SERVER_ROOT_URL=https://grafana.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in this stack's .env}
      # SSO through Authentik (native OIDC, provider `grafana`). Off unless
      # .env turns it on, so the laptop runs without a client. Authentik only
      # lets `grafana-users` through to the app; grafana-admins get Admin,
      # everyone else Viewer. The local admin login stays as break-glass.
      # The token and userinfo calls come from Grafana's `edge` address and
      # rely on @authentik_oidc_internal in the Caddyfile. `monitoring` sorts
      # after `edge`, so no gw_priority is needed (see stacks/beszel).
      - GF_AUTH_GENERIC_OAUTH_ENABLED=${GRAFANA_OIDC_ENABLED:-false}
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_OIDC_CLIENT_ID:-}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET:-}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://authentik.${PUBLIC_DOMAIN}/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://authentik.${PUBLIC_DOMAIN}/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://authentik.${PUBLIC_DOMAIN}/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL=https://authentik.${PUBLIC_DOMAIN}/application/o/grafana/end-session/
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH=email
      - GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
      - GF_AUTH_GENERIC_OAUTH_ALLOWED_GROUPS=grafana-users
      - "GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'"
    ports:
      # Break-glass over ssh; the vhost (with Authentik OIDC) comes later.
      - "127.0.0.1:${GRAFANA_PORT:-3007}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    labels:
      homepage.group: Ops
      homepage.name: Grafana
      homepage.description: Metrics history, dashboards and probe alerts
      homepage.href: https://grafana.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in this stack's .env}
      homepage.icon: grafana
    # `edge` is for Caddy and the OIDC backchannel.
    networks:
      - default
      - edge
    depends_on:
      - victoriametrics
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    container_name: monitoring-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/monitoring/blackbox.yml
    volumes:
      # Directory mount, same reason as victoriametrics.
      - ./config:/etc/monitoring:ro
    # `edge` to probe the apps by container name, as Kuma does.
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9115/-/healthy || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vm-data:
    labels:
      # Metric history only; the scrape config is in the repo and 30 days of
      # trend lines are not worth a nightly archive.
      homelab.backup: exclude
  grafana-data:
    labels:
      # Data source, dashboards, alert rules and contact point are provisioned
      # from config/ in the repo; the volume holds only the SQLite state that
      # is rebuilt on start (sessions, alert state history).
      homelab.backup: exclude

networks:
  edge:
    external: true
