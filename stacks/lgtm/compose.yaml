name: lgtm

# Observability for this laptop. See
# $SITE_DIR/docs/superpowers/specs/2026-08-06-lgtm-stack-design.md
#
# Tags are pinned deliberately: Loki and Mimir migrate on-disk schemas between
# releases, so :latest can hand you a storage format this config does not
# expect. Bump on purpose.

x-homelab:
  # `planned`, not `production`, since 2026-09-06. The field said production
  # for months while the stack had never once run on the server -- proven when
  # a `docker compose up -d` across every stack pulled all five of its images,
  # which it would not have done had they been there.
  #
  # That mislabel is not cosmetic: status.py alerts on `production` stacks
  # that have run here and are now down, so promoting a stack before it is
  # deployed either fires a permanent false alarm or, worse, trains you to
  # ignore the one channel that reports a real outage. `planned` and
  # `developing` are both expected to be down.
  #
  # Set this back to `production` when lgtm is actually deployed and meant to
  # stay up -- not when its compose file looks finished.
  lifecycle: planned
  purpose: Observability for everything else -- the thing that answers "why is that slow"
  description: Loki, Tempo and Mimir behind one OTel collector, fronted by Grafana
  host: both
  # `lan`: 3007 (Grafana) and the two OTLP receivers 4317/4318 are published
  # on every interface. Grafana behind an admin password is not the same as
  # unreachable, and an open OTLP receiver accepts telemetry from anything on
  # the LAN that finds it.
  exposure: lan
  data: replaceable
  prerequisites: Docker socket and /var/lib/docker/containers, both read-only

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: lgtm-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    # Root is required, not laziness: /var/lib/docker/containers is 0700 root,
    # and the docker socket is root-owned. The default otelcol user (10001)
    # cannot read either.
    user: "0:0"
    volumes:
      # One subdirectory per service, each holding a file named exactly what
      # that service expects, so every mount here can be a DIRECTORY. Single
      # file mounts pin an inode and `git pull` replaces by rename, which
      # means config edits silently never reach the container while a reload
      # reports success -- docs/lessons-learned.md 18.
      #
      # That layout is why the files are ./config/<service>/config.yaml rather
      # than ./config/<service>.yaml: the name has to match what the command
      # line below asks for, because the whole directory is what gets mounted.
      #
      # Verified 2026-09-03 by `docker cp` from each image: otelcol, tempo and
      # mimir ship nothing at these paths, so nothing is shadowed.
      - ./config/otelcol:/etc/otelcol:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /:/hostfs:ro,rslave          # hostmetrics root_path
    ports:
      - "4317:4317"                  # OTLP gRPC
      - "4318:4318"                  # OTLP HTTP
    depends_on: [loki, tempo, mimir]
    networks: [lgtm]

  loki:
    image: grafana/loki:3.7.6
    container_name: lgtm-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml", "-target=all"]
    volumes:
      # Loki is the one exception to "shadows nothing": its image ships
      # /etc/loki/local-config.yaml, which this mount hides. That is harmless
      # and deliberate -- local-config.yaml is only the default used when no
      # -config.file is given, and the command below names config.yaml
      # explicitly, so it was never read.
      - ./config/loki:/etc/loki:ro
      - loki-data:/loki
    labels:
      docker-volume-backup.stop-during-backup: "true"
    networks: [lgtm]

  tempo:
    image: grafana/tempo:2.9.4
    container_name: lgtm-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./config/tempo:/etc/tempo:ro
      - tempo-data:/var/tempo
    labels:
      docker-volume-backup.stop-during-backup: "true"
    networks: [lgtm]

  mimir:
    image: grafana/mimir:3.1.4
    container_name: lgtm-mimir
    restart: unless-stopped
    command: ["-config.file=/etc/mimir/config.yaml", "-target=all"]
    volumes:
      - ./config/mimir:/etc/mimir:ro
      - mimir-data:/data
    labels:
      docker-volume-backup.stop-during-backup: "true"
    networks: [lgtm]

  grafana:
    image: grafana/grafana:13.1.2
    container_name: lgtm-grafana
    restart: unless-stopped
    ports:
      - "3007:3000"                  # 3000-3006 taken, see docs/ports.md
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set it in .env}
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    labels:
      homepage.group: Observability
      homepage.name: Grafana
      homepage.description: Logs, traces and metrics for this laptop
      homepage.href: http://${HOMELAB_HOST:-localhost}:3007
      homepage.icon: grafana
      docker-volume-backup.stop-during-backup: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on: [loki, tempo, mimir]
    networks: [lgtm]

networks:
  lgtm:

volumes:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
