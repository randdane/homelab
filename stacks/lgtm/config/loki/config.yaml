auth_enabled: false          # single tenant; Mimir's equivalent is multitenancy_enabled

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Without this Loki rejects OTLP payloads as malformed rather than failing
  # in any obvious way.
  allow_structured_metadata: true
  retention_period: 168h
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  # Both of these are required. retention_enabled unset (the default) means the
  # compactor only compacts indexes and logs live forever; delete_request_store
  # is mandatory whenever retention is on -- it is where deletion markers live.
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
