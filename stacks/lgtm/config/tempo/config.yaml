server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m       # flush quickly so traces show up while testing

compactor:
  compaction:
    block_retention: 168h      # Tempo's default is 336h, so this is a real override

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:8080/api/v1/push
        send_exemplars: true
    # Defaults to true. Mimir has multitenancy off, so sending X-Scope-OrgID
    # here would be inconsistent with the rest of the stack.
    remote_write_add_org_id_header: false
  traces_storage:
    path: /var/tempo/generator/traces

# Processors are DISABLED by default, and configuring remote_write above does
# not turn them on. Without this block Tempo starts cleanly, logs no error, and
# generates nothing at all. First thing to check if the service graph is empty.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
