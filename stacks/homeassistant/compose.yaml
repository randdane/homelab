name: homeassistant

x-homelab:
  lifecycle: planned
  host: server
  exposure: lan
  data: precious
  purpose: Home automation -- lights, sensors, and whatever else ends up on the network
  prerequisites: Device discovery needs host networking; see README
  description: Config and the state database live in one volume

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.8.1
    container_name: homeassistant
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
    ports:
      - "${PORT:-8123}:8123"
    volumes:
      - config:/config
      - /etc/localtime:/etc/localtime:ro
    labels:
      homepage.group: Home
      homepage.name: Home Assistant
      homepage.description: Lights, sensors, and automations
      homepage.href: http://${HOMELAB_HOST:-localhost}:${PORT:-8123}
      homepage.icon: home-assistant
      docker-volume-backup.stop-during-backup: "true"
    # No healthcheck: the image ships neither curl nor wget in a form that
    # survives their base image changes, and a healthcheck calling a missing
    # binary reports unhealthy forever. Presence is what the tracker uses.

volumes:
  # Config, automations, and home-assistant_v2.db -- all your history.
  # Rebuilding this by hand is days of work.
  config:
