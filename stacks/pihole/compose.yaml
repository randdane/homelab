name: pihole

x-homelab:
  lifecycle: planned
  host: server
  exposure: lan
  data: replaceable
  purpose: Network-wide ad blocking and local DNS for every device in the house
  prerequisites: Port 53 free -- systemd-resolved usually holds it; see README
  description: Blocklists and local DNS records; losing it means re-adding lists, not data

services:
  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
      # Answer queries arriving on any interface, not just the container's
      # own -- without this Pi-hole ignores the rest of the LAN.
      - FTLCONF_dns_listeningMode=all
    ports:
      # 53 on the server. The laptop overrides DNS_PORT in .env because
      # systemd-resolved already holds 53 there.
      - "${DNS_PORT:-53}:53/tcp"
      - "${DNS_PORT:-53}:53/udp"
      - "${PORT:-8091}:80"
    volumes:
      - pihole-data:/etc/pihole
    labels:
      homepage.group: Network
      homepage.name: Pi-hole
      homepage.description: DNS and ad blocking for the whole house
      homepage.href: http://${HOMELAB_HOST:-localhost}:${PORT:-8091}/admin
      homepage.icon: pi-hole
      docker-volume-backup.stop-during-backup: "true"
    # No healthcheck block: the image already ships one.

volumes:
  # Blocklists, local DNS records, and query history. Replaceable -- the
  # lists re-download and the records are a few lines -- but the stack is
  # load-bearing while running: if it stops, house-wide DNS stops with it.
  pihole-data:
