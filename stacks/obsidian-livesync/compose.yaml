name: obsidian-livesync

x-homelab:
  lifecycle: planned
  host: server
  exposure: lan
  data: precious
  purpose: Syncs Obsidian notes between devices without a third party holding them
  prerequisites: COUCHDB_USER and COUCHDB_PASSWORD in .env; the Obsidian plugin must be configured per device
  description: CouchDB tuned for the Self-hosted LiveSync plugin -- CORS and single-node settings are required, not optional

services:
  couchdb:
    image: couchdb:3.5.2.1
    container_name: obsidian-livesync
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
      - COUCHDB_USER=${COUCHDB_USER:?set COUCHDB_USER in .env}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD in .env}
    ports:
      - "${PORT:-5984}:5984"
    volumes:
      - data:/opt/couchdb/data
      # CouchDB reads every .ini in local.d. Without this file the plugin
      # cannot connect at all -- see README.
      #
      # NOT :ro, unlike every other config mount in this repo. CouchDB's
      # entrypoint chowns local.d at startup; against a read-only mount that
      # fails and the container exits 1 with an empty log. Verified, not
      # assumed -- do not "fix" this back to :ro.
      - ./config/10-homelab.ini:/opt/couchdb/etc/local.d/10-homelab.ini
    labels:
      docker-volume-backup.stop-during-backup: "true"
    healthcheck:
      # 401 counts as healthy: `require_valid_user = true` in our config means
      # even /_up demands credentials, so an auth challenge proves the HTTP
      # server is answering. The alternative -- putting the admin password in
      # the healthcheck command -- is worse for no gain.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5984/_up | grep -qE '200|401'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # Every note revision the plugin has ever synced.
  data:
