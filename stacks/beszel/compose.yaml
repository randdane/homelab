name: beszel

x-homelab:
  lifecycle: production
  host: always-on
  exposure: lan
  # Metric history and alert settings. Losing them costs the trend lines and
  # a few minutes of re-clicking; nothing irreplaceable.
  data: replaceable
  purpose: CPU, memory, disk, temperature and per-container history for homelab and pve, with threshold alerts
  prerequisites: PUBLIC_DOMAIN in .env; BESZEL_KEY after the hub's first run (README)
  description: Beszel hub plus a local agent; pve runs its own agent as a binary

services:
  hub:
    image: henrygd/beszel:0.21.0
    container_name: beszel-hub
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
      - APP_URL=https://beszel.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
    # Loopback only: the vhost is the way in, this is break-glass over ssh.
    ports:
      - "127.0.0.1:${PORT:-8094}:8090"
    volumes:
      - data:/beszel_data
      # The local agent listens on a unix socket here instead of a TCP port,
      # so nothing on the network can reach it. Added in the UI as host
      # /beszel_socket/beszel.sock.
      - socket:/beszel_socket
    networks:
      default:
      # Default route via `edge`, so the OIDC token request reaches Caddy from
      # this container's own edge address. Docker otherwise picks the gateway
      # by network name, `beszel_default` sorts first, and the request arrives
      # SNAT'd as 10.201.7.1 -- which @authentik_oidc_internal refuses, so SSO
      # fails with a bare 400 and no token request in Authentik's log.
      edge:
        gw_priority: 1
    labels:
      homepage.group: Ops
      homepage.name: Beszel
      homepage.description: Host and container resource history
      homepage.href: https://beszel.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      homepage.icon: beszel
      docker-volume-backup.stop-during-backup: "true"
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  agent:
    image: henrygd/beszel-agent:0.21.0
    container_name: beszel-agent
    restart: unless-stopped
    # Host network so it reports the VM's own interfaces, not a bridge veth.
    network_mode: host
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      # The hub's public key: the agent only answers a hub holding the
      # matching private key. Shown in the hub's "Add system" dialog, so it
      # cannot exist before the hub's first run: blank is allowed, and the
      # first deploy starts `hub` alone (README).
      - KEY=${BESZEL_KEY:-}
      # Through the read-only proxy below, never the raw socket.
      - DOCKER_HOST=tcp://127.0.0.1:${PROXY_PORT:-2377}
      # Its image-update check inspects every image (GET /images/*/json) and
      # compares registry digests -- cup's job here already, so off rather
      # than widening the proxy.
      - DOCKER_IMAGE_CHECK=false
    volumes:
      - agent-data:/var/lib/beszel-agent
      - socket:/beszel_socket
    depends_on: [socket-proxy]
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  socket-proxy:
    # `:ro` on the docker socket restricts the FILE, not the Docker API.
    # This proxy is what restricts it. See docs/lessons-learned.md §27.
    image: wollomatic/socket-proxy:1.13.1
    container_name: beszel-socket-proxy
    restart: unless-stopped
    # Runs as nobody; the socket is root:docker 0660, so it needs the
    # host's docker group. Host-specific, hence .env.
    user: "65534:${DOCKER_GID:?set DOCKER_GID in this stack's .env -- getent group docker}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The agent is on the host network, so it cannot resolve a container
    # name. Sharing that network puts the proxy on loopback with no published
    # port, and -allowfrom can name the one address that may call it.
    network_mode: host
    command:
      - -listenip=127.0.0.1
      - -proxyport=${PROXY_PORT:-2377}
      - -allowfrom=127.0.0.1/32
      - -allowhealthcheck
      - -watchdoginterval=3600
      - -stoponwatchdog
      # Every other method is refused. The same paths tecnativa allowed here,
      # counting its defaults (EVENTS, PING, VERSION). Patterns are anchored.
      - -allowGET=(/v[0-9.]+)?/(containers(/.*)?|events|info|version|_ping)
      - -allowHEAD=(/v[0-9.]+)?/(containers(/.*)?|events|info|version|_ping)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  edge:
    external: true

volumes:
  # Users, systems, alert rules and metric history (SQLite).
  data:
  socket:
    labels:
      homelab.backup: exclude  # a unix socket, recreated at start
  agent-data:
    labels:
      homelab.backup: exclude  # agent fingerprint only; re-pairs if lost
