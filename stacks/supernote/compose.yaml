name: supernote

x-homelab:
  lifecycle: production
  host: always-on
  exposure: lan
  data: precious
  purpose: Supernote Private Cloud -- the e-ink tablet's notes and documents sync here instead of Ratta's cloud
  prerequisites: PUBLIC_DOMAIN, MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD and REDIS_PASSWORD in .env
  description: Ratta's official images; the database is schema-only from supernotedb.sql

# Adapted from Ratta's docker-compose.yml (see README). Changes: named volumes
# instead of ./sndata bind mounts, no secret defaults, Caddy terminates TLS so
# the container's own 443 is not published, and the project default network
# instead of Ratta's fixed-name supernote-net.
#
# The service finds its neighbours by these service names. Its jar falls back
# to them too (mariadb, redis, notelib) but also to built-in passwords, so
# every variable is set explicitly.

services:
  mariadb:
    # Exactly Ratta's version: they test the schema against it and warn
    # against upgrading.
    image: mariadb:10.6.24
    container_name: supernote-mariadb
    restart: unless-stopped
    command: --skip-name-resolve --bind-address=0.0.0.0
    environment:
      - TZ=${TZ:-America/Chicago}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=supernotedb
      - MYSQL_USER=supernote
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db:/var/lib/mysql
      # Runs on first start only, against an empty volume.
      - ./supernotedb.sql:/docker-entrypoint-initdb.d/supernotedb.sql:ro
    labels:
      docker-volume-backup.stop-during-backup: "true"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4.7
    container_name: supernote-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  notelib:
    # Note conversion (previews, exports). Its own version series, unrelated
    # to the service's date tags.
    image: supernote/notelib:6.9.3
    container_name: supernote-notelib
    restart: unless-stopped
    # It renders a note by downloading it from the service's public URL
    # (https://supernote.<domain>/api/oss/download...), so it goes through
    # Caddy, which admits `edge` for that path only. See the Caddyfile.
    networks:
      - default
      - edge
    # No healthcheck: the image has no curl, wget or nc, and its command ends
    # in `tail -f /dev/null`, so the container stays up even if noteServer dies.

  service:
    image: supernote/supernote-service:26.10.09
    container_name: supernote-service
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TZ=${TZ:-America/Chicago}
      - DB_HOSTNAME=mariadb
      - MYSQL_DATABASE=supernotedb
      - MYSQL_USER=supernote
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - NOTELIB_HOST=notelib
    ports:
      # Break-glass over ssh; the way in is the vhost.
      - "127.0.0.1:${PORT:-19072}:8080"
      # 18072 (auto-sync WebSocket) is not published: it works through
      # Caddy on 443. See README, "Auto-sync".
    volumes:
      - data:/home/supernote/data
      - recycle:/home/supernote/recycle
      - convert:/home/supernote/convert
      - logs:/home/supernote/logs
      # Not optional: the entrypoint starts the web portal with its output
      # redirected here, and the directory is absent from the image. Without
      # the mount the redirect fails, the portal never starts, and Nginx
      # answers 502 while the healthcheck stays green.
      - cloud-logs:/home/supernote/cloud/logs
    networks:
      - default
      - edge
    labels:
      homepage.group: Home
      homepage.name: Supernote
      homepage.description: Handwritten notes and documents synced from the tablet
      homepage.href: https://supernote.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      homepage.icon: mdi-notebook-edit
      docker-volume-backup.stop-during-backup: "true"
    # The image ships bash but no curl, wget or nc. 8080 is Nginx, which
    # answers even when what it fronts is down; 9888 is the web portal.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && exec 4<>/dev/tcp/127.0.0.1/9888"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true

volumes:
  # Users, devices and the sync index. Restore it together with `data`.
  db:
  # The notes and documents themselves.
  data:
  # Files deleted from the cloud, kept until emptied.
  recycle:
  redis:
    labels:
      homelab.backup: exclude  # login sessions; recreated on next login
  convert:
    labels:
      homelab.backup: exclude  # conversion scratch; regenerated by notelib
  logs:
    labels:
      homelab.backup: exclude  # application logs
  cloud-logs:
    labels:
      homelab.backup: exclude  # web portal logs
