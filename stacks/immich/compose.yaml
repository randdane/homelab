name: immich

# Adapted from the upstream release compose:
# https://github.com/immich-app/immich/releases/download/v3.2.4/docker-compose.yml
# The four services are versioned together: bump IMMICH_VERSION only together
# with the database and Valkey images from that release's compose.

x-homelab:
  lifecycle: developing
  host: always-on
  exposure: lan
  data: precious
  purpose: Photo and video library -- the replacement for a phone camera roll
  prerequisites: tank/photos shared into VM 101 over virtiofs at /mnt/photos (README); DB_PASSWORD and PUBLIC_DOMAIN in .env
  description: Server, machine-learning, Valkey, and a Postgres built with vectorchord

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.2.4}
    container_name: immich-server
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
      - DB_HOSTNAME=database
      - DB_USERNAME=${DB_USERNAME:-immich}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME:-immich}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - REDIS_HOSTNAME=redis
    # Loopback only: the vhost is the way in, this is break-glass over ssh.
    ports:
      - "127.0.0.1:${PORT:-2283}:2283"
    volumes:
      # tank/photos on pve, over virtiofs (README). The bind is the
      # `immich` SUBDIRECTORY, which exists only on the dataset: if the share
      # is not mounted, the source is missing and compose refuses, instead of
      # Immich initialising a library on the VM's 64 GB disk.
      - type: bind
        source: /mnt/photos/immich
        target: /data
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    # Joins `edge` so Caddy can reach it for the immich.<PUBLIC_DOMAIN> vhost.
    networks:
      - default
      - edge
    depends_on:
      - redis
      - database
    labels:
      homepage.group: Files
      homepage.name: Immich
      homepage.description: Photos and videos, with search and face recognition
      homepage.href: https://immich.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      homepage.icon: immich
    healthcheck:
      disable: false

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.2.4}
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false

  redis:
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    # Not an ordinary Postgres: the tag encodes the vector extensions Immich
    # expects. Stock postgres starts, then fails every search.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME:-immich}
      - POSTGRES_DB=${DB_DATABASE_NAME:-immich}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 128mb
    labels:
      docker-volume-backup.stop-during-backup: "true"
    healthcheck:
      disable: false

volumes:
  db-data:
  model-cache:
    labels:
      # Downloaded CLIP/face models, re-fetched automatically. Several GB.
      homelab.backup: exclude

networks:
  edge:
    external: true
