name: syncthing

x-homelab:
  lifecycle: developing
  host: always-on
  exposure: lan
  data: precious
  purpose: Always-on Syncthing peer, so the laptop and phone sync without being on at once
  prerequisites: PUBLIC_DOMAIN in .env; 101.fw admits 22000 tcp+udp from the LAN
  description: Holds a full copy of every shared folder; backed up by the backup stack

services:
  syncthing:
    # Pinned: v2 keeps its index in a database it migrates on upgrade.
    image: syncthing/syncthing:2.1.6
    container_name: syncthing
    hostname: homelab
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Chicago}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      # Sync protocol. LAN clients come through 101.fw's rule; off-LAN ones
      # over the tailnet, which that firewall does not see.
      - "22000:22000/tcp"
      - "22000:22000/udp"
      # GUI: loopback only. The way in is https://syncthing.<PUBLIC_DOMAIN>,
      # behind the remote_ip gate, Authentik forward-auth and its own
      # password. If Caddy or Authentik is down:
      #   ssh -N -L 8384:127.0.0.1:8384 homelab
      - "127.0.0.1:${PORT:-8384}:8384"
    # No 21027/udp: local discovery is a broadcast, which does not reach a
    # bridge network. Clients list this peer's address by hand (README).
    volumes:
      - data:/var/syncthing
    # `admin`, not `edge`: this UI can add a device and share it any folder.
    networks:
      - default
      - admin
    labels:
      homepage.group: Ops
      homepage.name: Syncthing
      homepage.description: Always-on sync peer
      homepage.href: https://syncthing.${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      homepage.icon: syncthing
    # The image's own healthcheck: curl against /rest/noauth/health.

networks:
  admin:
    external: true

volumes:
  # Config, keys (the device ID) and every synced folder. Losing the keys
  # means a new device ID, re-paired on every client.
  data:
